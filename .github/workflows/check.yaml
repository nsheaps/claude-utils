name: check

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Find bash scripts
        id: find-bash
        run: |
          bash_files=""
          # .sh files with bash shebangs
          for f in $(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          # bin/ scripts without .sh extension
          for f in $(find ./bin -maxdepth 1 -type f -not -name '*.sh' -not -path './.git/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          echo "files=$bash_files" >> "$GITHUB_OUTPUT"
          echo "Found bash files:$bash_files"

      # Autofix runs first and is tolerant of failure so a fix it DID manage
      # to make still gets committed and pushed. shfmt's own step status
      # still reports the failure (continue-on-error only stops it from
      # blocking downstream `success()` checks); the re-raise step below
      # turns that into an overall job failure after the commit step runs.
      - name: shfmt -w (autofix)
        id: shfmt
        if: steps.find-bash.outputs.files != ''
        continue-on-error: true
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running shfmt on:$bash_files"
          # -w writes formatting changes in place; indent settings sourced from .editorconfig
          shfmt -w $bash_files

      - name: Commit and push shfmt fixes
        if: steps.find-bash.outputs.files != '' && !cancelled()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: `shfmt -w`"
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}

      - name: Fail if shfmt found unfixable issues
        if: steps.shfmt.outcome == 'failure' && !cancelled()
        run: |
          echo "shfmt reported a failure (see 'shfmt -w (autofix)' step above for details)." >&2
          exit 1

      # Check-only steps below can't auto-fix their own findings. They run
      # without continue-on-error so each step's own status accurately
      # reflects pass/fail (no green checkmarks on a failed linter). Each
      # step uses `!cancelled()` so one linter failing doesn't skip the
      # rest -- all linters still run, in order, and the job fails
      # overall if any of them failed, same as a normal
      # (non-continue-on-error) step failure would.
      - name: ShellCheck
        id: shellcheck
        if: steps.find-bash.outputs.files != '' && !cancelled()
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running ShellCheck on:$bash_files"
          shellcheck $bash_files

      - name: EditorConfig check
        id: editorconfig
        if: '!cancelled()'
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run editorconfig-checker
        id: editorconfig-run
        if: '!cancelled()'
        run: editorconfig-checker
