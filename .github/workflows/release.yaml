name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          fetch-depth: "0"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        # Bun is the package manager now (mise provides it). --frozen-lockfile is the
        # documented CI invocation and asserts bun.lock is in sync.
        run: bun install --frozen-lockfile

      - name: Run release-it
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # release-it runs under node (kept in mise [tools]); invoke the locally
          # installed bin directly rather than via bunx so it uses its node shebang.
          node_modules/.bin/release-it --ci
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build platform binaries and upload release assets
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          ROOT="$PWD"

          # bun cross-compiles every target from this single Linux runner. For each platform,
          # assemble a staging bin/ = the committed bash CLIs (and bin/lib) PLUS that platform's
          # compiled agent-hook + agent-plugin, then tar it so the archive root contains bin/.
          # (bin/agent-hook and bin/agent-plugin are no longer committed; they are produced here.)
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            case "$platform" in
              linux-amd64) target="bun-linux-x64" ;;
              linux-arm64) target="bun-linux-arm64" ;;
              darwin-amd64) target="bun-darwin-x64" ;;
              darwin-arm64) target="bun-darwin-arm64" ;;
            esac

            staging="$ROOT/staging/$platform"
            rm -rf "$staging"
            mkdir -p "$staging/bin"
            # Copy the bash CLIs + bin/lib (everything left in bin/ after untracking the binaries).
            cp -R "$ROOT/bin/." "$staging/bin/"

            for pkg in agent-hook agent-plugin; do
              (cd "$ROOT/packages/$pkg" && bun "$ROOT/scripts/build-cli.mjs" --target="$target" --outdir="$staging/bin")
            done

            # -C "$staging" . puts bin/ at the tarball root so `bin.install Dir['bin/*']` finds it.
            tar -czf "$ROOT/claude-utils-${platform}.tar.gz" -C "$staging" .
          done

          gh release upload "$TAG" \
            claude-utils-linux-amd64.tar.gz \
            claude-utils-linux-arm64.tar.gz \
            claude-utils-darwin-amd64.tar.gz \
            claude-utils-darwin-arm64.tar.gz
          rm -f claude-utils-*.tar.gz

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get job context
        id: context
        uses: qoomon/actions--context@v5

      - name: Authenticate as GitHub App
        id: auth
        uses: ./.github/actions/github-app-auth
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}

      - name: Get release info
        id: release
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          TAG="${{ needs.release.outputs.tag }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHA256
        id: shas
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p /tmp/assets
          # Each platform tarball was uploaded by the release job. Download it, hash it, and
          # expose the checksum as an output the gomplate step maps to a SHA256_* env var.
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            asset="claude-utils-${platform}.tar.gz"
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$asset" \
              --dir /tmp/assets \
              --clobber
            sha="$(sha256sum "/tmp/assets/${asset}" | cut -d' ' -f1)"
            key="$(echo "$platform" | tr 'a-z-' 'A-Z_')"
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
            echo "Successfully got SHA256 for ${platform}: ${sha}"
          done

      - name: Clone homebrew-devsetup
        run: |
          gh repo clone nsheaps/homebrew-devsetup homebrew-devsetup

      - name: Install gomplate
        run: |
          curl -fsSL https://github.com/hairyhenderson/gomplate/releases/latest/download/gomplate_linux-amd64 -o /usr/local/bin/gomplate
          chmod +x /usr/local/bin/gomplate

      - name: Generate formula from template
        env:
          Tag: ${{ steps.release.outputs.tag }}
          SHA256_LINUX_AMD64: ${{ steps.shas.outputs.LINUX_AMD64 }}
          SHA256_LINUX_ARM64: ${{ steps.shas.outputs.LINUX_ARM64 }}
          SHA256_DARWIN_AMD64: ${{ steps.shas.outputs.DARWIN_AMD64 }}
          SHA256_DARWIN_ARM64: ${{ steps.shas.outputs.DARWIN_ARM64 }}
        run: |
          gomplate -f Formula/claude-utils.rb.gotmpl -o homebrew-devsetup/Formula/claude-utils.rb

      - name: Close stale formula PRs
        run: |
          cd homebrew-devsetup
          # Close any open PRs from previous formula updates — they're superseded
          gh pr list --state open --search "chore: update claude-utils to" --json number,title --jq '.[].number' | while read -r pr_num; do
            echo "Closing superseded PR #${pr_num}"
            gh pr close "$pr_num" --comment "Superseded by v${{ steps.release.outputs.version }} update."
          done

      - name: Create PR to update formula
        id: formula-pr
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          JOB_URL: ${{ env.GITHUB_JOB_URL }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cd homebrew-devsetup
          BRANCH="bump-claude-utils-${VERSION}"

          # Delete remote branch if it exists from a previous failed run
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add Formula/claude-utils.rb
          git commit -m "chore: update claude-utils to ${VERSION}"
          git push -u origin "$BRANCH"

          printf 'Automated formula update from claude-utils release\n\n**Release:** %s\n**Workflow:** %s\n' "$RELEASE_URL" "$JOB_URL" > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --title "chore: update claude-utils to ${VERSION}" \
            --body-file /tmp/pr-body.md \
            --base main)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge with retry
        env:
          PR_URL: ${{ steps.formula-pr.outputs.pr_url }}
        run: |
          # Retry auto-merge — CI checks on the target repo need time to start,
          # and the GraphQL API rejects enablePullRequestAutoMerge while the PR
          # is in "unstable" (checks pending) status.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --auto --squash; then
              echo "Auto-merge enabled successfully on attempt ${attempt}"
              exit 0
            fi
            wait=$((attempt * 10))
            echo "Auto-merge not ready (attempt ${attempt}/5), waiting ${wait}s..."
            sleep "$wait"
          done
          echo "::warning::Could not enable auto-merge after 5 attempts. PR was created successfully at ${PR_URL} — merge manually or re-run."
